<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
  <!-- Capa ilustrativa com dados fictícios -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a9e52"/>
      <stop offset="1" stop-color="#4f5f2c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- pista -->
  <path d="M-20 420 C 200 360, 420 470, 820 380" stroke="#ffffff" stroke-opacity=".14" stroke-width="46" fill="none"/>
  <path d="M-20 420 C 200 360, 420 470, 820 380" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="14 12" fill="none"/>

  <!-- painel da organização (fundo) -->
  <g transform="translate(410 70)">
    <rect width="330" height="250" rx="14" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="20" y="34" fill="#fff" font-size="15" font-weight="700">Painel da organização</text>
    <g fill="#fff">
      <rect x="20" y="52" width="92" height="62" rx="10" fill-opacity=".16"/>
      <rect x="120" y="52" width="92" height="62" rx="10" fill-opacity=".16"/>
      <rect x="220" y="52" width="92" height="62" rx="10" fill-opacity=".16"/>
      <text x="30" y="76" font-size="11" fill-opacity=".8">Inscritos</text>
      <text x="30" y="102" font-size="22" font-weight="800">186</text>
      <text x="130" y="76" font-size="11" fill-opacity=".8">A conferir</text>
      <text x="130" y="102" font-size="22" font-weight="800">12</text>
      <text x="230" y="76" font-size="11" fill-opacity=".8">Espera</text>
      <text x="230" y="102" font-size="22" font-weight="800">9</text>
    </g>
    <g font-size="11" fill="#fff">
      <text x="20" y="142" fill-opacity=".8">Vagas por turno</text>
      <rect x="20" y="152" width="290" height="10" rx="5" fill-opacity=".18"/>
      <rect x="20" y="152" width="230" height="10" rx="5" fill="#d9f27a"/>
      <rect x="20" y="172" width="290" height="10" rx="5" fill-opacity=".18"/>
      <rect x="20" y="172" width="160" height="10" rx="5" fill="#d9f27a"/>
      <rect x="20" y="192" width="290" height="10" rx="5" fill-opacity=".18"/>
      <rect x="20" y="192" width="268" height="10" rx="5" fill="#d9f27a"/>
      <rect x="20" y="214" width="120" height="22" rx="11" fill-opacity=".22"/>
      <text x="34" y="229" font-weight="700">Sortear convidados</text>
    </g>
  </g>

  <!-- tela de inscrição (frente) -->
  <g transform="translate(70 50)">
    <rect width="300" height="380" rx="22" fill="#ffffff"/>
    <text x="24" y="44" fill="#4f5f2c" font-size="12" font-weight="700" letter-spacing="1.5">CORRIDA 2026</text>
    <text x="24" y="72" fill="#1c1c1c" font-size="21" font-weight="800">Faça sua inscrição</text>
    <!-- passos -->
    <g font-size="11" font-weight="700">
      <circle cx="36" cy="102" r="12" fill="#4f5f2c"/><text x="32" y="106" fill="#fff">1</text>
      <rect x="50" y="101" width="40" height="2" fill="#4f5f2c"/>
      <circle cx="102" cy="102" r="12" fill="#4f5f2c"/><text x="98" y="106" fill="#fff">2</text>
      <rect x="116" y="101" width="40" height="2" fill="#d8dccb"/>
      <circle cx="168" cy="102" r="12" fill="#e6e9dc"/><text x="164" y="106" fill="#6b6860">3</text>
      <rect x="182" y="101" width="40" height="2" fill="#d8dccb"/>
      <circle cx="234" cy="102" r="12" fill="#e6e9dc"/><text x="230" y="106" fill="#6b6860">4</text>
    </g>
    <text x="24" y="146" fill="#6b6860" font-size="11">Matrícula</text>
    <rect x="24" y="154" width="252" height="36" rx="9" fill="#f3f4ee" stroke="#d8dccb"/>
    <text x="36" y="177" fill="#1c1c1c" font-size="13" font-weight="600">000123 · Ana Exemplo</text>
    <text x="24" y="214" fill="#6b6860" font-size="11">Modalidade</text>
    <rect x="24" y="222" width="122" height="40" rx="9" fill="#4f5f2c"/>
    <text x="64" y="247" fill="#fff" font-size="14" font-weight="700">5 km</text>
    <rect x="154" y="222" width="122" height="40" rx="9" fill="#f3f4ee" stroke="#d8dccb"/>
    <text x="192" y="247" fill="#1c1c1c" font-size="14" font-weight="700">10 km</text>
    <text x="24" y="290" fill="#6b6860" font-size="11">Vagas restantes</text>
    <text x="232" y="290" fill="#1c1c1c" font-size="11" font-weight="700">42/120</text>
    <rect x="24" y="298" width="252" height="8" rx="4" fill="#e6e9dc"/>
    <rect x="24" y="298" width="164" height="8" rx="4" fill="#8a9e52"/>
    <rect x="24" y="326" width="252" height="38" rx="19" fill="#1c1c1c"/>
    <text x="88" y="350" fill="#fff" font-size="13" font-weight="700">Confirmar inscrição</text>
  </g>
</svg>
