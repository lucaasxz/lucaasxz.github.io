<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
  <!-- Capa ilustrativa com dados fictícios -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4648a"/>
      <stop offset="1" stop-color="#9c3f62"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <g transform="translate(50 45)">
    <rect width="700" height="410" rx="18" fill="#ffffff"/>
    <!-- barra lateral -->
    <rect width="150" height="410" rx="18" fill="#2b2530"/>
    <rect x="132" width="18" height="410" fill="#2b2530"/>
    <text x="20" y="38" fill="#fff" font-size="14" font-weight="800">Indicadores</text>
    <g font-size="11" fill="#fff">
      <rect x="12" y="62" width="126" height="28" rx="8" fill="#d4648a"/>
      <text x="24" y="80" font-weight="700">Dashboard</text>
      <text x="24" y="114" fill-opacity=".7">Resumo executivo</text>
      <text x="24" y="144" fill-opacity=".7">Plano de ação</text>
      <text x="24" y="174" fill-opacity=".7">Visão gerencial</text>
      <text x="24" y="204" fill-opacity=".7">Apresentação</text>
      <text x="24" y="234" fill-opacity=".7">Organograma</text>
    </g>

    <text x="176" y="40" fill="#1c1c1c" font-size="19" font-weight="800">Dashboard · Setor Exemplo</text>
    <rect x="590" y="22" width="88" height="26" rx="13" fill="#f4eef1"/>
    <text x="606" y="40" fill="#9c3f62" font-size="11" font-weight="700">Ano 2026</text>

    <!-- KPIs -->
    <g>
      <rect x="176" y="64" width="158" height="74" rx="12" fill="#f7f4f6"/>
      <rect x="348" y="64" width="158" height="74" rx="12" fill="#f7f4f6"/>
      <rect x="520" y="64" width="158" height="74" rx="12" fill="#f7f4f6"/>
      <text x="190" y="88" fill="#6b6860" font-size="11">Turnover</text>
      <text x="190" y="120" fill="#1c1c1c" font-size="24" font-weight="800">1,8%</text>
      <text x="270" y="120" fill="#2a9d8f" font-size="11" font-weight="700">▼ 0,3</text>
      <text x="362" y="88" fill="#6b6860" font-size="11">Absenteísmo</text>
      <text x="362" y="120" fill="#1c1c1c" font-size="24" font-weight="800">2,4%</text>
      <text x="442" y="120" fill="#c0563f" font-size="11" font-weight="700">▲ 0,2</text>
      <text x="534" y="88" fill="#6b6860" font-size="11">Horas de treinamento</text>
      <text x="534" y="120" fill="#1c1c1c" font-size="24" font-weight="800">1.240</text>
    </g>

    <!-- gráfico de barras com meta -->
    <rect x="176" y="154" width="330" height="236" rx="12" fill="#f7f4f6"/>
    <text x="190" y="180" fill="#1c1c1c" font-size="12" font-weight="700">Realizado x Meta</text>
    <g fill="#d4648a">
      <rect x="196" y="262" width="20" height="108" rx="3"/>
      <rect x="222" y="244" width="20" height="126" rx="3"/>
      <rect x="248" y="280" width="20" height="90" rx="3"/>
      <rect x="274" y="232" width="20" height="138" rx="3"/>
      <rect x="300" y="250" width="20" height="120" rx="3"/>
      <rect x="326" y="220" width="20" height="150" rx="3"/>
      <rect x="352" y="238" width="20" height="132" rx="3"/>
      <rect x="378" y="212" width="20" height="158" rx="3"/>
      <rect x="404" y="226" width="20" height="144" rx="3"/>
      <rect x="430" y="204" width="20" height="166" rx="3" fill-opacity=".35"/>
      <rect x="456" y="204" width="20" height="166" rx="3" fill-opacity=".35"/>
    </g>
    <line x1="190" y1="236" x2="492" y2="236" stroke="#2b2530" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="456" y="230" fill="#2b2530" font-size="10" font-weight="700">meta</text>

    <!-- velocímetro -->
    <rect x="520" y="154" width="158" height="236" rx="12" fill="#f7f4f6"/>
    <text x="534" y="180" fill="#1c1c1c" font-size="12" font-weight="700">Atingimento</text>
    <path d="M545 290 A 54 54 0 0 1 653 290" fill="none" stroke="#eadde3" stroke-width="16" stroke-linecap="round"/>
    <path d="M545 290 A 54 54 0 0 1 635 252" fill="none" stroke="#d4648a" stroke-width="16" stroke-linecap="round"/>
    <text x="574" y="290" fill="#1c1c1c" font-size="22" font-weight="800">87%</text>
    <g font-size="10">
      <circle cx="540" cy="326" r="5" fill="#2a9d8f"/><text x="552" y="330" fill="#6b6860">Positivo · 6</text>
      <circle cx="540" cy="346" r="5" fill="#e0a43a"/><text x="552" y="350" fill="#6b6860">Atenção · 3</text>
      <circle cx="540" cy="366" r="5" fill="#c0563f"/><text x="552" y="370" fill="#6b6860">Negativo · 1</text>
    </g>
  </g>
</svg>
