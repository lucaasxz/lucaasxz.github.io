<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Credencial do trabalhador liberada">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <pattern id="grade" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="visto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F5D95"/>
      <stop offset="100%" stop-color="#3E4978"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#fundo)"/>
  <rect width="1600" height="1000" fill="url(#grade)"/>

  <!-- Composicao deslocada para a faixa central: a esquerda da tela e area de
       texto do hero e a direita fica sob o painel de 480px do formulario. -->
  <g transform="translate(160 155) scale(0.75)">

  <!-- Cordão: desce das duas pontas e fecha no presilha do crachá. -->
  <g fill="none" stroke="#EAE5DF" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round">
    <path d="M660 20 C700 160 760 230 800 270"/>
    <path d="M940 20 C900 160 840 230 800 270"/>
  </g>
  <rect x="778" y="262" width="44" height="26" rx="6" fill="#0B0B0B" stroke="#EAE5DF" stroke-opacity="0.5" stroke-width="4"/>

  <!-- Crachá. -->
  <g>
    <rect x="540" y="300" width="520" height="600" rx="24" fill="#161616" stroke="#EAE5DF" stroke-opacity="0.55" stroke-width="4"/>
    <!-- Faixa superior na cor da marca, com o furo do cordão. -->
    <path d="M540 324 a24 24 0 0 1 24 -24 h472 a24 24 0 0 1 24 24 v56 h-520 z" fill="#4F5D95" fill-opacity="0.9"/>
    <rect x="770" y="330" width="60" height="18" rx="9" fill="#0B0B0B" fill-opacity="0.55"/>

    <!-- Retrato. -->
    <circle cx="800" cy="520" r="88" fill="#0F0F0F" stroke="#EAE5DF" stroke-opacity="0.45" stroke-width="4"/>
    <circle cx="800" cy="492" r="34" fill="#EAE5DF" fill-opacity="0.4"/>
    <path d="M744 584 a56 56 0 0 1 112 0 z" fill="#EAE5DF" fill-opacity="0.4"/>
    <!-- Capacete: quem entra na área industrial. -->
    <path d="M744 476 a56 56 0 0 1 112 0 z" fill="#4F5D95" fill-opacity="0.85"/>
    <rect x="734" y="470" width="132" height="12" rx="6" fill="#4F5D95" fill-opacity="0.85"/>

    <!-- Nome e empresa. -->
    <rect x="660" y="648" width="280" height="18" rx="9" fill="#EAE5DF" fill-opacity="0.5"/>
    <rect x="700" y="686" width="200" height="14" rx="7" fill="#EAE5DF" fill-opacity="0.22"/>

    <!-- Faixa de situação: liberado. -->
    <rect x="640" y="744" width="320" height="64" rx="32" fill="#4F5D95" fill-opacity="0.12" stroke="#4F5D95" stroke-opacity="0.5" stroke-width="3"/>
    <g transform="translate(676 758) scale(0.44)">
      <path d="M4 20 L30 10 L58 62 L94 4 L110 16 L66 86 C62 92 54 92 50 86 Z" fill="url(#visto)"/>
    </g>
    <rect x="738" y="768" width="180" height="16" rx="8" fill="#EAE5DF" fill-opacity="0.55"/>

    <!-- Código da credencial. -->
    <g fill="#EAE5DF" fill-opacity="0.3">
      <rect x="660" y="844" width="8" height="30"/>
      <rect x="676" y="844" width="4" height="30"/>
      <rect x="688" y="844" width="10" height="30"/>
      <rect x="706" y="844" width="4" height="30"/>
      <rect x="718" y="844" width="8" height="30"/>
      <rect x="734" y="844" width="12" height="30"/>
      <rect x="754" y="844" width="4" height="30"/>
      <rect x="766" y="844" width="8" height="30"/>
      <rect x="782" y="844" width="10" height="30"/>
      <rect x="800" y="844" width="4" height="30"/>
      <rect x="812" y="844" width="8" height="30"/>
      <rect x="828" y="844" width="12" height="30"/>
      <rect x="848" y="844" width="4" height="30"/>
      <rect x="860" y="844" width="10" height="30"/>
      <rect x="878" y="844" width="8" height="30"/>
      <rect x="894" y="844" width="4" height="30"/>
      <rect x="906" y="844" width="12" height="30"/>
      <rect x="926" y="844" width="8" height="30"/>
    </g>
  </g>
</g>
</svg>
