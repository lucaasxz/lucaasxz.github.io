<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Documento conferido e aprovado">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <pattern id="grade" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="visto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F5D95"/>
      <stop offset="100%" stop-color="#3E4978"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#fundo)"/>
  <rect width="1600" height="1000" fill="url(#grade)"/>

  <!-- Composicao deslocada para a faixa central: a esquerda da tela e area de
       texto do hero e a direita fica sob o painel de 480px do formulario. -->
  <g transform="translate(48 124) scale(0.8)">

  <!-- Duas folhas ao fundo, sugerindo a pilha que chega para conferência. -->
  <g stroke="#EAE5DF" stroke-opacity="0.18" fill="#111111" stroke-width="3">
    <rect x="620" y="150" width="440" height="600" rx="10" transform="rotate(-6 840 450)"/>
    <rect x="640" y="160" width="440" height="600" rx="10" transform="rotate(-3 860 460)"/>
  </g>

  <!-- Folha da frente: a que está sendo conferida agora. -->
  <g>
    <rect x="660" y="170" width="440" height="600" rx="10" fill="#161616" stroke="#EAE5DF" stroke-opacity="0.55" stroke-width="4"/>

    <!-- Cabeçalho do documento. -->
    <rect x="710" y="230" width="180" height="16" rx="8" fill="#EAE5DF" fill-opacity="0.55"/>
    <rect x="710" y="266" width="120" height="12" rx="6" fill="#EAE5DF" fill-opacity="0.25"/>

    <!-- Linhas de conteúdo. -->
    <g fill="#EAE5DF" fill-opacity="0.18">
      <rect x="710" y="330" width="340" height="12" rx="6"/>
      <rect x="710" y="366" width="300" height="12" rx="6"/>
      <rect x="710" y="402" width="340" height="12" rx="6"/>
      <rect x="710" y="438" width="240" height="12" rx="6"/>
      <rect x="710" y="502" width="340" height="12" rx="6"/>
      <rect x="710" y="538" width="280" height="12" rx="6"/>
      <rect x="710" y="574" width="320" height="12" rx="6"/>
    </g>

    <!-- Campo de validade, o dado que a mesa confere. -->
    <rect x="710" y="640" width="200" height="60" rx="8" fill="none" stroke="#EAE5DF" stroke-opacity="0.3" stroke-width="3"/>
    <rect x="734" y="662" width="110" height="14" rx="7" fill="#EAE5DF" fill-opacity="0.3"/>
  </g>

  <!-- Selo de conferido: anel tracejado e a marca do visto. -->
  <g transform="translate(1010 630)">
    <circle r="150" fill="#0B0B0B" fill-opacity="0.85" stroke="#4F5D95" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="14 12"/>
    <g transform="translate(-84 -70) scale(1.5)">
      <path d="M4 20 L30 10 L58 62 L94 4 L110 16 L66 86 C62 92 54 92 50 86 Z" fill="url(#visto)"/>
    </g>
  </g>
</g>
</svg>
