<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Empresa terceira enviando a documentação">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <pattern id="grade" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="visto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F5D95"/>
      <stop offset="100%" stop-color="#3E4978"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#fundo)"/>
  <rect width="1600" height="1000" fill="url(#grade)"/>

  <!-- Composicao deslocada para a faixa central: a esquerda da tela e area de
       texto do hero e a direita fica sob o painel de 480px do formulario. -->
  <g transform="translate(283 140) scale(0.62)">

  <!-- Galpão da empresa terceira: telhado dente-de-serra. -->
  <g fill="#141414" stroke="#EAE5DF" stroke-opacity="0.5" stroke-width="4">
    <path d="M300 560 l70 -70 v70 l70 -70 v70 l70 -70 v70 l70 -70 v70 z"/>
    <rect x="300" y="560" width="280" height="280" rx="6"/>
  </g>
  <g fill="#EAE5DF" fill-opacity="0.2">
    <rect x="336" y="608" width="56" height="56" rx="4"/>
    <rect x="412" y="608" width="56" height="56" rx="4"/>
    <rect x="488" y="608" width="56" height="56" rx="4"/>
  </g>
  <rect x="396" y="730" width="88" height="110" rx="4" fill="#0B0B0B" stroke="#EAE5DF" stroke-opacity="0.4" stroke-width="3"/>
  <rect x="300" y="548" width="280" height="12" fill="#4F5D95" fill-opacity="0.75"/>

  <!-- Trajeto dos documentos até a mesa que confere. -->
  <path d="M600 640 C740 640 760 420 900 420" fill="none" stroke="#EAE5DF" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="12 14"/>

  <!-- Documentos em trânsito, do menor (saindo) ao maior (chegando). -->
  <g fill="#161616" stroke="#EAE5DF" stroke-opacity="0.45" stroke-width="3">
    <g transform="translate(636 592) rotate(-8)">
      <rect width="70" height="92" rx="6"/>
      <g fill="#EAE5DF" fill-opacity="0.28" stroke="none">
        <rect x="14" y="20" width="42" height="7" rx="3.5"/>
        <rect x="14" y="38" width="42" height="7" rx="3.5"/>
        <rect x="14" y="56" width="28" height="7" rx="3.5"/>
      </g>
    </g>
    <g transform="translate(736 500) rotate(-4)">
      <rect width="86" height="112" rx="6"/>
      <g fill="#EAE5DF" fill-opacity="0.3" stroke="none">
        <rect x="16" y="24" width="54" height="8" rx="4"/>
        <rect x="16" y="46" width="54" height="8" rx="4"/>
        <rect x="16" y="68" width="34" height="8" rx="4"/>
      </g>
    </g>
  </g>

  <!-- A mesa: o documento chega, é conferido e vira visto. -->
  <g>
    <rect x="880" y="320" width="300" height="392" rx="12" fill="#161616" stroke="#EAE5DF" stroke-opacity="0.55" stroke-width="4"/>
    <g fill="#EAE5DF" fill-opacity="0.3">
      <rect x="920" y="372" width="150" height="14" rx="7"/>
      <rect x="920" y="406" width="100" height="10" rx="5"/>
    </g>
    <g fill="#EAE5DF" fill-opacity="0.18">
      <rect x="920" y="462" width="220" height="10" rx="5"/>
      <rect x="920" y="492" width="190" height="10" rx="5"/>
      <rect x="920" y="522" width="220" height="10" rx="5"/>
      <rect x="920" y="552" width="140" height="10" rx="5"/>
    </g>
    <rect x="920" y="612" width="220" height="56" rx="28" fill="#4F5D95" fill-opacity="0.12" stroke="#4F5D95" stroke-opacity="0.45" stroke-width="3"/>
    <g transform="translate(950 626) scale(0.34)">
      <path d="M4 20 L30 10 L58 62 L94 4 L110 16 L66 86 C62 92 54 92 50 86 Z" fill="url(#visto)"/>
    </g>
    <rect x="1000" y="632" width="110" height="14" rx="7" fill="#EAE5DF" fill-opacity="0.45"/>
  </g>

  <!-- Chão comum das duas pontas. -->
  <path d="M240 840 H1300" stroke="#EAE5DF" stroke-opacity="0.28" stroke-width="4"/>
</g>
</svg>
