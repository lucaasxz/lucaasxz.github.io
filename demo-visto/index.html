    <div id="root"></div>
    <!-- Tema antes da primeira pintura: sem isto, quem escolheu o modo escuro
         vê um lampejo branco em cada carregamento, enquanto o bundle baixa.
         Fica inline e minúsculo de propósito — um arquivo separado voltaria a
         ser uma requisição na frente da pintura. A chave é a mesma de
         src/lib/tema.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('visto.tema') || 'sistema';
          if (t === 'sistema') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
          }
          document.documentElement.setAttribute('data-tema', t);
        } catch (e) {
          document.documentElement.setAttribute('data-tema', 'claro');
        }
      })();
    </script>
  </body>
